services:
  portfolio:
    build: .
    container_name: portfolio
    restart: unless-stopped

    ports:
      - "127.0.0.1:8002:8000"

    env_file:
      - .env

    environment:
      DJANGO_DEBUG: "False"
      DJANGO_DB_PATH: "/app/data/db.sqlite3"

    volumes:
      - portfolio_db:/app/data

volumes:
  portfolio_db:
